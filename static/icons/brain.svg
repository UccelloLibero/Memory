<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
    .spark { transform-box: fill-box; transform-origin: center; animation: twinkle 2.4s ease-in-out infinite; }
    .spark-2 { animation-delay: 1.2s; }
    @keyframes twinkle { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.5); opacity: 0.4; } }
    @media (prefers-reduced-motion: reduce) { .spark { animation: none; } }
</style>
<!-- Outline: the same bumpy shape, slightly larger, behind the brain -->
<g fill="#5e1d42">
    <ellipse cx="32" cy="34" rx="25.5" ry="18.5"/>
    <circle cx="12" cy="29" r="9.5"/>
    <circle cx="17" cy="19.5" r="9.5"/>
    <circle cx="26.5" cy="14.5" r="9.5"/>
    <circle cx="37.5" cy="14.5" r="9.5"/>
    <circle cx="47" cy="19.5" r="9.5"/>
    <circle cx="52" cy="29" r="9.5"/>
    <circle cx="50" cy="40" r="9.5"/>
    <circle cx="14" cy="40" r="9.5"/>
</g>
<!-- Brain -->
<g fill="#ff8fc4">
    <ellipse cx="32" cy="34" rx="23" ry="16"/>
    <circle cx="12" cy="29" r="7"/>
    <circle cx="17" cy="19.5" r="7"/>
    <circle cx="26.5" cy="14.5" r="7"/>
    <circle cx="37.5" cy="14.5" r="7"/>
    <circle cx="47" cy="19.5" r="7"/>
    <circle cx="52" cy="29" r="7"/>
    <circle cx="50" cy="40" r="7"/>
    <circle cx="14" cy="40" r="7"/>
</g>
<!-- Shine -->
<ellipse cx="20" cy="14" rx="4" ry="2" fill="#fff" opacity="0.6" transform="rotate(-30 20 14)"/>
<!-- Centre split and squiggly folds -->
<g stroke="#d9579a" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M32 9c-2.5 2.5 2.5 4.5 0 7s2.5 4.5 0 7"/>
    <path d="M10 28c3-2.5 5 1.5 8-1"/>
    <path d="M17 17c1 3 5 2.5 6 5"/>
    <path d="M24 12c1.5 2 3 1 4 3"/>
    <path d="M54 28c-3-2.5-5 1.5-8-1"/>
    <path d="M47 17c-1 3-5 2.5-6 5"/>
    <path d="M40 12c-1.5 2-3 1-4 3"/>
    <path d="M10 41c2-1.5 4 .5 6-1"/>
    <path d="M54 41c-2-1.5-4 .5-6-1"/>
</g>
<!-- Face -->
<ellipse cx="18.5" cy="40" rx="3.2" ry="2" fill="#ff5e9e" opacity="0.75"/>
<ellipse cx="45.5" cy="40" rx="3.2" ry="2" fill="#ff5e9e" opacity="0.75"/>
<ellipse cx="25.5" cy="34" rx="2.6" ry="3.2" fill="#2a1030"/>
<ellipse cx="38.5" cy="34" rx="2.6" ry="3.2" fill="#2a1030"/>
<circle cx="26.4" cy="32.8" r="1" fill="#fff"/>
<circle cx="39.4" cy="32.8" r="1" fill="#fff"/>
<path d="M28.5 40.5c2 2.4 5 2.4 7 0" stroke="#2a1030" stroke-width="2" stroke-linecap="round"/>
<!-- Sparkles -->
<path class="spark" d="M57 2l1.4 3.6L62 7l-3.6 1.4L57 12l-1.4-3.6L52 7l3.6-1.4z" fill="#b6e94a"/>
<path class="spark spark-2" d="M5 50l1 2.5 2.5 1-2.5 1L5 57l-1-2.5-2.5-1 2.5-1z" fill="#b6e94a"/>
</svg>
