{% extends "base.html" %}

{% block title %}Play · Memory{% endblock %}

{% block content %}
<section class="game">
    <!-- HUD -->
    <div class="hud">
        <div class="pill" title="Time">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 10.4 3.5 2.1-.9 1.5L11 13V6h2z"/></svg>
            <strong id="timer">00:00</strong>
        </div>
        <div class="pill" title="Moves">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h9a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm13 3.2 1.7.5a2 2 0 0 1 1.4 2.4l-3 11.5A2 2 0 0 1 15.7 22l-5.2-1.4H14a4 4 0 0 0 4-4z"/></svg>
            <strong id="moves">0</strong><span class="pill-label">moves</span>
        </div>
        <div class="pill pill-score" title="Score">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 2.9 6.6 7.1.6-5.4 4.7 1.6 7.1L12 17.3 5.8 21l1.6-7.1L2 9.2l7.1-.6z"/></svg>
            <strong id="score">0</strong><span class="pill-label">pts</span>
        </div>
        <div class="pill pill-best" title="Personal best">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v2h4v3a5 5 0 0 1-4.6 5A5 5 0 0 1 13 15.9V19h4v2H7v-2h4v-3.1A5 5 0 0 1 7.6 13 5 5 0 0 1 3 8V5h4zm0 4H5v1a3 3 0 0 0 2 2.8zm10 0v3.8A3 3 0 0 0 19 8V7z"/></svg>
            <strong id="best">–</strong>
        </div>
        <button id="sound-toggle" class="pill pill-sound" type="button" aria-pressed="true" aria-label="Sound on" title="Sound on">
            <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
            <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9zm13.6 3 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4z"/></svg>
        </button>
    </div>

    <!-- Progress and board, centered in the space below the HUD -->
    <div class="play-area">
        <!-- Level and pair progress -->
        <div class="level-row">
            <span id="level-badge" class="level-badge">Level 1</span>
            <div id="progress" class="progress" aria-label="Pairs found"></div>
        </div>

        <!-- Game Board -->
        <div class="board-wrap">
            <div id="game-board" class="game-board" data-images='{{ card_images | tojson }}'></div>
            <div id="toast" class="toast" aria-live="polite"></div>
        </div>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ static_url('js/game.js') }}"></script>
{% endblock %}
