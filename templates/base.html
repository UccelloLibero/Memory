<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b0f1a">
    <title>{% block title %}Memory{% endblock %}</title>
    <link rel="icon" href="{{ static_url('favicon/favicon-32.png') }}" sizes="32x32" type="image/png">
    <link rel="icon" href="{{ static_url('favicon/favicon-192.png') }}" sizes="192x192" type="image/png">
    <link rel="apple-touch-icon" href="{{ static_url('favicon/apple-touch-icon.png') }}">
    <link rel="preload" href="{{ url_for('static', filename='fonts/fredoka-latin.woff2') }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ static_url('css/style.css') }}">
</head>
<body class="page-{{ request.endpoint }}">
    <main class="stage">
        {% block content %}{% endblock %}
    </main>

    <!-- Floating Dock -->
    <nav class="dock" aria-label="Main">
        <a href="/" class="dock-item {% if request.endpoint == 'index' %}active{% endif %}">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
            <span>Home</span>
        </a>
        <a href="/game" class="dock-item {% if request.endpoint == 'game' %}active{% endif %}">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>
            <span>Play</span>
        </a>
        <a href="/about" class="dock-item {% if request.endpoint == 'about' %}active{% endif %}">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-6h2zm0-8h-2V7h2z"/></svg>
            <span>About</span>
        </a>
    </nav>

    <script src="{{ static_url('js/sound.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
